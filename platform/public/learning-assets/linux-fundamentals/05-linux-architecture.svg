<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-labelledby="title description">
  <title id="title">Linux distributivi va tizim arxitekturasi</title>
  <desc id="description">CPU arxitekturasi, Linux yadrosi, distributiv vositalari va foydalanuvchi dasturlari qatlamlari.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111b30"/>
      <stop offset="1" stop-color="#1b2c45"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="440" rx="26" fill="url(#background)"/>
  <text x="54" y="58" fill="#f3f7ff" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Linux: bir nechta qatlam, bitta tizim</text>
  <text x="54" y="91" fill="#a9bad1" font-family="Segoe UI, Arial, sans-serif" font-size="16">Distributiv kernelni kundalik dasturlar bilan birlashtiradi.</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="106" y="124" width="648" height="60" rx="14" fill="#26324d" stroke="#675f9c"/>
    <text x="430" y="151" fill="#c6bbff" font-size="17" font-weight="700" text-anchor="middle">FOYDALANUVCHI DASTURLARI</text>
    <text x="430" y="172" fill="#ddd8f4" font-size="13" text-anchor="middle">Shell · web server · editor · ish stoli</text>
    <rect x="106" y="198" width="648" height="60" rx="14" fill="#173c39" stroke="#348b72"/>
    <text x="430" y="225" fill="#8fe0c0" font-size="17" font-weight="700" text-anchor="middle">GNU / SYSTEM TOOLS / XIZMATLAR</text>
    <text x="430" y="246" fill="#d2ece3" font-size="13" text-anchor="middle">Buyruq vositalari · systemd · paketlar</text>
    <rect x="106" y="272" width="648" height="60" rx="14" fill="#19384e" stroke="#3b7e9f"/>
    <text x="430" y="299" fill="#8bd6ef" font-size="17" font-weight="700" text-anchor="middle">LINUX KERNELI</text>
    <text x="430" y="320" fill="#d4eaf2" font-size="13" text-anchor="middle">Jarayon · xotira · drayver · fayl tizimi · system call</text>
    <rect x="106" y="346" width="648" height="54" rx="14" fill="#423723" stroke="#a18243"/>
    <text x="430" y="369" fill="#f3d288" font-size="16" font-weight="700" text-anchor="middle">CPU ARXITEKTURASI</text>
    <text x="430" y="389" fill="#e7ddc6" font-family="Consolas, monospace" font-size="13" text-anchor="middle">x86_64 / amd64  ·  ARM64 / aarch64</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="796" y="128" width="250" height="96" rx="16" fill="#16293a" stroke="#405c77"/>
    <text x="921" y="159" fill="#9ccaff" font-size="15" font-weight="700" text-anchor="middle">DISTRIBUTIV</text>
    <text x="921" y="186" fill="#e3edf8" font-size="15" text-anchor="middle">Ubuntu · Fedora · Debian</text>
    <text x="921" y="208" fill="#b9c9dc" font-size="13" text-anchor="middle">Kernel + vositalar + paketlar</text>
    <path d="M767 220h19" stroke="#80a8cc" stroke-width="3"/>
    <path d="m779 212 12 8-12 8" fill="none" stroke="#80a8cc" stroke-width="3"/>
    <rect x="796" y="252" width="250" height="120" rx="16" fill="#16293a" stroke="#405c77"/>
    <text x="921" y="283" fill="#8fe0c0" font-size="15" font-weight="700" text-anchor="middle">YUKLANISH OQIMI</text>
    <text x="921" y="311" fill="#e3edf8" font-size="14" text-anchor="middle">Firmware → bootloader</text>
    <text x="921" y="335" fill="#e3edf8" font-size="14" text-anchor="middle">→ kernel → systemd</text>
    <text x="921" y="359" fill="#b9c9dc" font-size="13" text-anchor="middle">→ xizmatlar va login</text>
  </g>
</svg>
