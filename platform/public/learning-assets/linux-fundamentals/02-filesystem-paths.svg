<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-labelledby="title description">
  <title id="title">Linux kataloglar daraxti va yo‘llar</title>
  <desc id="description">Ildiz katalogidan tarqaluvchi asosiy Linux kataloglari hamda mutlaq va nisbiy yo‘l farqi.</desc>
  <rect width="1100" height="440" rx="26" fill="#121d31"/>
  <text x="54" y="58" fill="#f3f7ff" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Fayl tizimi: ildizdan maqsadgacha</text>
  <text x="54" y="91" fill="#a9bad1" font-family="Segoe UI, Arial, sans-serif" font-size="16">Mutlaq yo‘l `/` dan boshlanadi; nisbiy yo‘l joriy katalogga bog‘liq.</text>
  <path d="M550 166v35M550 201H225v35M550 201H445v35M550 201H665v35M550 201H875v35" fill="none" stroke="#607b9c" stroke-width="3"/>
  <rect x="500" y="120" width="100" height="46" rx="12" fill="#174e62" stroke="#42b6c8"/>
  <text x="550" y="150" fill="#e8fbff" font-family="Consolas, monospace" font-size="22" text-anchor="middle">/</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="135" y="236" width="180" height="82" rx="14" fill="#1e3d3c" stroke="#3da78e"/>
    <text x="225" y="269" fill="#8ce2c8" font-size="19" font-weight="700" text-anchor="middle">/home</text>
    <text x="225" y="295" fill="#d2e8e2" font-size="14" text-anchor="middle">Foydalanuvchi fayllari</text>
    <rect x="355" y="236" width="180" height="82" rx="14" fill="#263951" stroke="#5d87b7"/>
    <text x="445" y="269" fill="#a8d1ff" font-family="Consolas, monospace" font-size="19" font-weight="700" text-anchor="middle">/etc</text>
    <text x="445" y="295" fill="#d4dfeb" font-size="14" text-anchor="middle">Tizim sozlamalari</text>
    <rect x="575" y="236" width="180" height="82" rx="14" fill="#3c3425" stroke="#a98949"/>
    <text x="665" y="269" fill="#f5d389" font-family="Consolas, monospace" font-size="19" font-weight="700" text-anchor="middle">/var</text>
    <text x="665" y="295" fill="#e5ddca" font-size="14" text-anchor="middle">Log va o‘zgaruvchan ma’lumot</text>
    <rect x="785" y="236" width="180" height="82" rx="14" fill="#36314a" stroke="#8872bb"/>
    <text x="875" y="269" fill="#c6b5ff" font-family="Consolas, monospace" font-size="19" font-weight="700" text-anchor="middle">/usr</text>
    <text x="875" y="295" fill="#ded9ed" font-size="14" text-anchor="middle">Dastur va kutubxonalar</text>
  </g>
  <rect x="54" y="347" width="475" height="55" rx="12" fill="#182c42" stroke="#385d7e"/>
  <text x="74" y="371" fill="#84c8ff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">MUTLAQ YO‘L</text>
  <text x="74" y="391" fill="#edf5ff" font-family="Consolas, monospace" font-size="15">/home/ali/docs/notes.txt</text>
  <rect x="571" y="347" width="475" height="55" rx="12" fill="#18372f" stroke="#34745d"/>
  <text x="591" y="371" fill="#8be0b9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">NISBIY YO‘L (joriy katalog: /home/ali)</text>
  <text x="591" y="391" fill="#e6f8ef" font-family="Consolas, monospace" font-size="15">docs/notes.txt</text>
</svg>
