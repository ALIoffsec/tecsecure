<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-labelledby="title description">
  <title id="title">Linux buyruq satrining tuzilishi</title>
  <desc id="description">Prompt, buyruq, parametr va argument oqimini ko‘rsatuvchi diagramma.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101c31"/>
      <stop offset="1" stop-color="#172943"/>
    </linearGradient>
    <linearGradient id="command" x1="0" x2="1">
      <stop offset="0" stop-color="#1b5b79"/>
      <stop offset="1" stop-color="#167a85"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="440" rx="26" fill="url(#background)"/>
  <text x="54" y="58" fill="#f3f7ff" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Buyruq satrini qismlarga ajrating</text>
  <text x="54" y="91" fill="#a9bad1" font-family="Segoe UI, Arial, sans-serif" font-size="16">Shell kiritilgan satrni buyruq, parametr va argumentlarga ajratadi.</text>
  <rect x="54" y="128" width="992" height="104" rx="16" fill="#0b1322" stroke="#324660"/>
  <circle cx="80" cy="153" r="6" fill="#ff6b73"/>
  <circle cx="101" cy="153" r="6" fill="#f6c55b"/>
  <circle cx="122" cy="153" r="6" fill="#50d7a2"/>
  <text x="80" y="199" fill="#54d6a8" font-family="Consolas, monospace" font-size="22">$</text>
  <text x="112" y="199" fill="#f7fafc" font-family="Consolas, monospace" font-size="22">grep</text>
  <text x="198" y="199" fill="#f5c46b" font-family="Consolas, monospace" font-size="22">-n</text>
  <text x="239" y="199" fill="#a9bad1" font-family="Consolas, monospace" font-size="22">"ERROR"</text>
  <text x="342" y="199" fill="#72b9ff" font-family="Consolas, monospace" font-size="22">app.log</text>
  <path d="M130 218v30h-25v20" fill="none" stroke="#54d6a8" stroke-width="2"/>
  <path d="M209 218v30h-5v20" fill="none" stroke="#f5c46b" stroke-width="2"/>
  <path d="M280 218v30h150v20" fill="none" stroke="#a9bad1" stroke-width="2"/>
  <path d="M375 218v30h348v20" fill="none" stroke="#72b9ff" stroke-width="2"/>
  <rect x="54" y="268" width="194" height="102" rx="14" fill="#143a36" stroke="#287d68"/>
  <text x="72" y="302" fill="#83e8c1" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">PROMPT</text>
  <text x="72" y="333" fill="#e2f5ee" font-family="Segoe UI, Arial, sans-serif" font-size="16">Shell kutish holatida</text>
  <text x="72" y="355" fill="#b5d8ca" font-family="Segoe UI, Arial, sans-serif" font-size="14">$ belgisi</text>
  <rect x="270" y="268" width="194" height="102" rx="14" fill="#18384c" stroke="#2e7790"/>
  <text x="288" y="302" fill="#79d5e5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">BUYRUQ</text>
  <text x="288" y="333" fill="#e9f8fb" font-family="Consolas, monospace" font-size="18">grep</text>
  <text x="288" y="355" fill="#b8d5df" font-family="Segoe UI, Arial, sans-serif" font-size="14">Dastur nomi</text>
  <rect x="486" y="268" width="194" height="102" rx="14" fill="#483a24" stroke="#9c7735"/>
  <text x="504" y="302" fill="#f6ce7b" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">PARAMETR</text>
  <text x="504" y="333" fill="#fff5df" font-family="Consolas, monospace" font-size="18">-n</text>
  <text x="504" y="355" fill="#dfcfac" font-family="Segoe UI, Arial, sans-serif" font-size="14">Xatti-harakatni belgilaydi</text>
  <rect x="702" y="268" width="344" height="102" rx="14" fill="#213550" stroke="#4874a2"/>
  <text x="720" y="302" fill="#8fc7ff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">ARGUMENTLAR</text>
  <text x="720" y="333" fill="#edf5ff" font-family="Consolas, monospace" font-size="18">"ERROR"  app.log</text>
  <text x="720" y="355" fill="#b9c9dc" font-family="Segoe UI, Arial, sans-serif" font-size="14">Qidiruv qiymati va fayl yo‘li</text>
  <text x="54" y="408" fill="#a9bad1" font-family="Segoe UI, Arial, sans-serif" font-size="14">Maslahat: bajarishdan oldin har bir parametr va nishon nimani anglatishini tekshiring.</text>
